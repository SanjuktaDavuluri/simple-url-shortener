<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* The shortener: form, field, Rejection Reason and result in one fragment (ADR 0006).
       The full page and HTMX responses render this same fragment. */-->
<section id="shortener" class="card" th:fragment="shortener" aria-labelledby="shortener-heading">
  <h2 id="shortener-heading">Shorten a link</h2>

  <form method="post" action="/" novalidate
        hx-post="/" hx-target="#shortener" hx-swap="outerHTML">
    <label for="url">Long URL</label>
    <div class="field-row">
      <input id="url" name="url" type="text" inputmode="url" autocomplete="url"
             spellcheck="false" autocapitalize="off"
             placeholder="https://example.com/a/very/long/address"
             th:value="${longUrl}"
             th:attr="aria-invalid=${rejectionReason != null} ? 'true' : null,
                      aria-describedby=${rejectionReason != null} ? 'url-error' : null">
      <button type="submit">Shorten</button>
    </div>
    <p id="url-error" class="field-error" role="alert" th:if="${rejectionReason != null}"
       th:text="${rejectionReason}">Rejection Reason</p>
  </form>

  <!--/* Kept on one line: .result:empty hides the box only when no whitespace is left inside. */-->
  <div id="result" class="result" aria-live="polite"><p class="failure" role="alert" th:if="${failure != null}" th:text="${failure}">Failure</p><p class="short-url" th:if="${link != null}"><span class="visually-hidden">Your Short URL:</span><a data-short-url th:href="${link.shortUrl()}" th:text="${link.shortUrl()}">Short URL</a><button type="button" data-copy th:attr="data-copy=${link.shortUrl()}" hidden>Copy</button></p></div>
</section>
</body>
</html>
