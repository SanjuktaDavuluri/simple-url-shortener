<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple URL Shortener</title>
  <meta name="description" content="Turn a long web address into a short one you can share.">
  <meta name="theme-color" content="#f5f5fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101018" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <!--/* HTMX doesn't swap 4xx/5xx responses by default; swap Rejections (422) and
         "no free Short Code" (503) so their messages appear inline (ADR 0006). */-->
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true}, {"code": "503", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <script src="/js/htmx-2.0.11.min.js" defer></script>
  <script src="/js/copy.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#url">Skip to the Long URL field</a>
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/favicon.svg" alt="" width="28" height="28">
      Simple URL Shortener
    </a>
  </header>
  <main id="main">
    <h1>Make long links short.</h1>
    <p class="lede">Paste a long web address and get a short one you can share anywhere.</p>
    <div th:replace="~{fragments/shortener :: shortener}"></div>
    <p id="status" role="status" aria-live="polite" class="visually-hidden"></p>
  </main>
  <footer class="site-footer">
    <p>Built in the open as an SDLC case study ·
      <a href="https://github.com/SanjuktaDavuluri/simple-url-shortener">Source on GitHub</a></p>
  </footer>
</body>
</html>
