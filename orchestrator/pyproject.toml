[project]
name = "delivery-orchestrator"
version = "0.1.0"
description = "Drives a GitHub Issue through gated delivery Stages to merge-ready pull requests (spec 0002)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "claude-agent-sdk>=0.2.164",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
orchestrate = "orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["orchestrator", "fakes", "conftest"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
