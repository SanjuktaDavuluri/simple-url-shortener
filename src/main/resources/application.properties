spring.application.name=simple-url-shortener
server.port=${PORT:8000}

# The shortener's public address; every Short URL starts with it.
shortener.base-url=${BASE_URL:http://localhost:8000}

# Click Recorder (ADR 0012, spec 0003): the most Clicks queued before new ones are dropped and
# counted, the most saved in one batch, the longest the writer waits for a batch to fill, and the
# longest a normal shutdown waits for queued Clicks to be saved (the rest are dropped and counted).
shortener.clicks.queue-capacity=${CLICK_QUEUE_CAPACITY:10000}
shortener.clicks.batch-size=${CLICK_BATCH_SIZE:500}
shortener.clicks.flush-interval=${CLICK_FLUSH_INTERVAL:1s}
shortener.clicks.shutdown-timeout=${CLICK_SHUTDOWN_TIMEOUT:10s}

# SQLite database file (ADR 0002). Schema is created by Flyway migrations.
shortener.database-path=${DATABASE_PATH:links.db}
spring.datasource.url=jdbc:sqlite:${shortener.database-path}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite concurrency (ADR 0021): every pooled connection runs in WAL mode, so Redirect reads never
# wait for a writer, with a busy timeout (ms), so the writers queue for SQLite's single write lock
# instead of failing. Set as sqlite-jdbc connection properties, never as a PRAGMA in a migration.
# Do not shrink the pool to 1 or turn WAL off without a new ADR.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.busy_timeout=5000

# Operability (ADR 0015, spec 0006): health checks and metrics on a separate management port that
# is never the public port. Only health and Prometheus metrics are exposed there; every Actuator
# path on the public port is a 404 like any unknown path. Liveness depends on nothing but the
# process; Readiness also needs the database and a Click queue that isn't saturated. The groups
# name their components with a status each, never details.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-components=always
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,clickQueue
management.endpoint.health.group.readiness.show-components=always
management.endpoint.health.group.readiness.show-details=never

# Errors (spec 0006, ADR 0015): an unexpected exception answers 500 without revealing internals.
# These are Spring Boot's defaults, set explicitly so a change of default can't expose them.
server.error.include-stacktrace=never
server.error.include-message=never

# Graceful shutdown (spec 0006, ADR 0012): the public server refuses new connections and lets
# in-flight requests finish for up to SHUTDOWN_TIMEOUT; the Click Recorder then flushes for up to
# CLICK_SHUTDOWN_TIMEOUT. Spring Boot's default, set explicitly so a change of default can't
# remove it.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:10s}
