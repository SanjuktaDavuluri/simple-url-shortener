# Local run: `docker compose up`. Settings pass through from the environment with the
# runbook's defaults (docs/runbook.md, Configuration reference). Never a deployment (ADR 0007).
services:
  shortener:
    build: .
    environment:
      PORT: ${PORT:-8000}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8081}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      CLICK_QUEUE_CAPACITY: ${CLICK_QUEUE_CAPACITY:-10000}
      CLICK_BATCH_SIZE: ${CLICK_BATCH_SIZE:-500}
      CLICK_FLUSH_INTERVAL: ${CLICK_FLUSH_INTERVAL:-1s}
      CLICK_SHUTDOWN_TIMEOUT: ${CLICK_SHUTDOWN_TIMEOUT:-10s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      # HOST_PORT / HOST_MANAGEMENT_PORT move the host side so a run never collides with 8000/8081.
      - "${HOST_PORT:-8000}:${PORT:-8000}"
      # The management port is private (ADR 0015): loopback only.
      - "127.0.0.1:${HOST_MANAGEMENT_PORT:-8081}:${MANAGEMENT_PORT:-8081}"
    volumes:
      - data:/data
    # Longer than SHUTDOWN_TIMEOUT + CLICK_SHUTDOWN_TIMEOUT at their defaults (10s + 10s).
    stop_grace_period: 30s
volumes:
  data:
