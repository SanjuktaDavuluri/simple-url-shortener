# Delivery orchestrator settings (spec 0002). Protected by CODEOWNERS; change only through a reviewed PR.
max_retries: 2          # gate retries per Stage before the Run pauses for the engineer
max_parallel_lanes: 2   # ticket Lanes running at once
cost_cap_step_usd: 5    # per agent step; reaching it triggers a Safe-stop
cost_cap_run_usd: 50    # per Run
model: claude-opus-5-5
board_owner: SanjuktaDavuluri   # delivery board (GitHub Project) where published tickets go
board_number: 1
# Exit Gate commands, run inside a Lane's own worktree (defaults shown)
verify_command: ./mvnw -B -q verify
web_paths: src/main/resources/templates/,src/main/resources/static/
app_start_command: scripts/local.sh start            # PORT and DATA_DIR are a free port and a fresh temp dir
app_stop_command: scripts/local.sh stop
browser_check_command: cd e2e && npm ci --silent && npm run browser-checks
